[package]
name = "kotoba-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0-rc.1"
borsh = { version = "1.8", features = ["derive", "unstable__schema"] }
schemars = "0.8"

[dev-dependencies]
near-sdk = { version = "=5.30.0-rc.1", features = ["unit-testing"] }
serde_json = "1"
near-workspaces = "=0.24.0-rc.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
sha2 = "0.10"
