[package]
name = "kotoba-oracle"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "kotoba-oracle"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
lopdf = { version = "0.38", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
